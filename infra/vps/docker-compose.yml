# Nuvem do app do gestor — VPS Hostinger (KVM 1, Sao Paulo).
#
# Regra que nao se quebra: o Postgres NAO publica porta. Ele existe apenas
# dentro da rede interna do Docker. Quem fala com o mundo e o Caddy, no 443.
# Se um dia alguem precisar acessar o banco de fora, a resposta e tunel SSH
# (ver README), nunca abrir a 5432.

name: genesis-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Sem isso o Postgres aceita qualquer senha vinda da rede do Docker.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # NOTA: a ausencia de `ports:` aqui e proposital. Nao adicione.

  # ---------------------------------------------------------------------------
  # A API chega na proxima etapa. Descomente junto com o bloco do Caddyfile.
  # ---------------------------------------------------------------------------
  # api:
  #   build: ../../api
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #     NODE_ENV: production
  #     TZ: America/Sao_Paulo
  #   networks:
  #     - interna
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # necessario para o desafio ACME e para redirecionar a 443
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      TZ: America/Sao_Paulo
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # guarda os certificados — nao apague este volume
      - caddy_config:/config
    networks:
      - interna

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
